{% extends 'base.html' %}

{% block title %}Delete listing{% endblock %}

{% block content %}
  <main class="mx-auto max-w-3xl px-4 py-8">
    <div class="rounded-2xl border border-mist bg-paper p-6 shadow-sm">
      <h1 class="text-h3 font-semibold text-ink">Delete “{{ listing.title }}”?</h1>
      <p class="mt-2 text-sm text-mute">
        This removes the listing, its photos, and its likes. This cannot be undone.
      </p>

      <form method="post" class="mt-6">
        {% csrf_token %}
        <button type="submit" class="rounded-xl border border-red-300 bg-paper px-4 py-2.5 text-sm font-medium text-red-600 transition hover:bg-red-50">
          Delete listing
        </button>
        <a href="{% url 'my_listings' %}" class="ml-3 inline-block rounded-xl border border-mist bg-paper px-4 py-2.5 text-sm font-medium text-ink transition hover:bg-mist">Cancel</a>
      </form>
    </div>
  </main>
{% endblock %}
