<form
  method="post"
  action="{% url 'listing_like_toggle' listing.public_id %}"
  class="inline"
  hx-post="{% url 'listing_like_toggle' listing.public_id %}"
  hx-target="this"
  hx-swap="outerHTML"
>
  {% csrf_token %}
  <button
    type="submit"
    aria-pressed="{{ is_liked|yesno:'true,false' }}"
    class="inline-flex items-center gap-2 rounded-full border border-leaf/60 bg-paper px-4 py-1.5 text-sm font-medium text-ink transition hover:bg-leaf/10"
  >
    {% if is_liked %}♥ Saved{% else %}♡ Save{% endif %}
    <span class="text-mute">{{ listing.likes_total }}</span>
  </button>
</form>
