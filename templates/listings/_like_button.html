<form
  method="post"
  action="{% url 'listing_like_toggle' listing.public_id %}"
  class="inline"
  hx-post="{% url 'listing_like_toggle' listing.public_id %}"
  hx-target="this"
  hx-swap="outerHTML"
>
  {% csrf_token %}
  <button
    type="submit"
    aria-pressed="{{ is_liked|yesno:'true,false' }}"
    class="rounded border border-fg/20 px-3 py-2 text-sm text-fg"
  >
    {% if is_liked %}♥ Saved{% else %}♡ Save{% endif %}
    <span class="text-fg/60">{{ listing.likes_total }}</span>
  </button>
</form>
